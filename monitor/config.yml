DEFAULT_LOG_FILE: "app.log"
DEFAULT_ACCESS_LOG: "access.log"
ALERT_LOG_FILE: "alerts.log"
POLL_INTERVAL_SECONDS: 2

THRESHOLDS:
  CPU:
    WARNING: 70.0
    CRITICAL: 90.0
  MEMORY:
    WARNING: 80.0
    CRITICAL: 95.0
  LOG_ERRORS:
    WARNING: 5
    CRITICAL: 10
    WINDOW_SECONDS: 300
  WEB_LATENCY:
    WARNING: 500.0
    CRITICAL: 1000.0
    WINDOW_SECONDS: 300
